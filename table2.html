<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Miki Ledger Table</title>

<!-- html2canvas Library para sa Screenshot Functionality -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 10px;
    width: 100%;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
}

.wrapper {
    width: 100%;
    max-width: 650px;
    margin: 0 auto;
}

/* Header Info Area (Name & Date) */
.info-bar {
    background: white;
    border: 1px solid #d1d5db;
    border-bottom: none;
    padding: 10px;
    display: flex;
    gap: 10px;
}

.info-group {
    display: flex;
    flex-direction: column;
    flex: 1;
}

.info-group label {
    font-size: 11px;
    font-weight: bold;
    color: #374151;
    margin-bottom: 3px;
    text-transform: uppercase;
}

.info-group input {
    height: 32px;
    padding: 4px 8px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    font-size: 13px;
    font-weight: bold;
    background: white;
}

.info-group input:focus {
    outline: 2px solid #2563eb;
}

/* Action Controls Area */
.action-bar {
    margin-top: 10px;
}

.screenshot-btn {
    width: 100%;
    height: 38px;
    background: #8b5cf6;
    color: white;
    border: none;
    border-radius: 4px;
    font-size: 12px;
    font-weight: bold;
    cursor: pointer;
}

.screenshot-btn:hover {
    background: #7c3aed;
}

/* Table Box Styling */
.table-box-2 {
    width: 100%;
    background: white;
    border: 1px solid #d1d5db;
}

table {
    width: 100%;
    border-collapse: collapse;
    table-layout: fixed;
}

th, td {
    border: 1px solid #d1d5db;
    height: 26px; 
    padding: 1px 2px;
    text-align: center;
    vertical-align: middle;
}

th {
    background: #111827;
    color: white;
    font-size: 10px;
    font-weight: bold;
    user-select: none;
}

th.lockable-header {
    cursor: pointer;
}

.colln-header {
    background: #f59e0b !important;
    color: #000000 !important;
}

td {
    background: white;
    font-size: 11px;
}

table input {
    width: 100%;
    height: 24px;
    padding: 1px 2px;
    border: 1px solid #9ca3af;
    border-radius: 4px;
    text-align: center;
    font-size: 11px;
    background: white;
}

table input.name-input {
    text-align: left;
    padding-left: 4px;
}

table input.readonly-col {
    background: #f9fafb;
    border: none;
}

table input.colln-input {
    background: #fef3c7 !important;
    border: 1px solid #f59e0b !important;
    font-weight: bold;
}

table input:focus {
    outline: 2px solid #94a3b8;
}

.amount {
    font-weight: bold;
}

.net-total-red {
    font-weight: bold;
    color: #dc2626;
    font-size: 10px;
    padding: 0 1px;
}

.miki {
    text-align: left;
    padding-left: 4px;
    font-weight: bold;
}

@media (max-width: 400px) {
    th, td {
        height: 24px;
        padding: 1px;
    }
    th { font-size: 9px; }
    td { font-size: 9.5px; }
    table input { font-size: 9.5px; }
}
</style>
</head>

<body>

<div class="wrapper">
    <!-- TARGET AREA FOR SCREENSHOT (NAME, DATE & TABLE) -->
    <div id="captureArea">
        <!-- NAME BAR AND DATE BAR -->
        <div class="info-bar">
            <div class="info-group">
                <label for="collectorName">Collector / Route Name:</label>
                <input type="text" id="collectorName" placeholder="e.g. Route A - Juan" oninput="saveHeaderInfo()">
            </div>
            <div class="info-group">
                <label for="ledgerDate">Date:</label>
                <input type="date" id="ledgerDate" oninput="saveHeaderInfo()">
            </div>
        </div>

        <!-- TABLE 2 LEDGER -->
        <div class="table-box-2">
            <table>
                <colgroup>
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 10%;">
                    <col style="width: 15%;">
                    <col style="width: 15%;">
                </colgroup>
                <thead>
                    <tr>
                        <th id="lockHeader" class="lockable-header" onclick="handleKeyClick()" title="Tap 5 times to Lock/Unlock">🔒</th>
                        <th>Dry</th>
                        <th>Fresh</th>
                        <th>Cab</th>
                        <th>BO</th>
                        <th>Bal</th>
                        <th>Billing</th>
                        <th class="colln-header">Coll'n</th>
                        <th>Utang</th>
                    </tr>
                </thead>
                <tbody id="ledgerTableBody">
                    <!-- Dynamic Rows Generated via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- SCREENSHOT BUTTON -->
    <div class="action-bar">
        <button id="screenshotBtn" class="screenshot-btn" onclick="takeScreenshot()">📸 TAKE SCREENSHOT & SHARE</button>
    </div>
</div>

<script src="table2.js"></script>
</body>
</html>
